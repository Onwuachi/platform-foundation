name: Install Service + Extras on EC2

on:
  workflow_dispatch:
    inputs:
      instance_ip:
        description: "EC2 public IP"
        required: true
        type: string

      service:
        description: "Main service to install"
        required: true
        type: choice
        options:
          - nginx
          - docker
          - haproxy
          - apache2
        default: nginx

      extras:
        description: "Extra packages (space-separated)"
        required: false
        type: string
        default: "python3-certbot-nginx"

jobs:
  ssh-install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Install service and extra packages
        run: |
          chmod +x ./scripts/install_packages.sh

          ./scripts/install_packages.sh \
            "${{ inputs.instance_ip }}" \
            ~/.ssh/id_rsa \
            ubuntu \
            "${{ inputs.service }}" \
            "${{ inputs.extras }}"
