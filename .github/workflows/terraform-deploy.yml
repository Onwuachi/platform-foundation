name: Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      approve:
        description: 'Approve deployment? (yes/no)'
        required: true
        default: 'no'
      environment:
        description: 'Target environment (dev, uat, stage, prod)'
        required: true
        default: 'dev'

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.event.inputs.environment }}

    if: |
      github.event.inputs.environment == 'dev' ||
      github.event.inputs.environment == 'uat' ||
      (github.event.inputs.environment == 'stage' && github.event.inputs.approve == 'yes') ||
      (github.event.inputs.environment == 'prod' && github.event.inputs.approve == 'yes')

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::046685909731:role/github-terraform-role
          aws-region: us-east-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan -var-file=environments/${{ github.event.inputs.environment }}.tfvars

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
