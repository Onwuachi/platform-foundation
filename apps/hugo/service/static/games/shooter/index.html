<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Platform Foundation — Space Shooter</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #05050f;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: monospace; overflow: hidden;
  }
  #game-area {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; height: 100%;
  }
  canvas {
    background: #0a0a1a; border: 2px solid #0f3460; display: block;
    touch-action: none;
    width: min(96vw, 170.6vh, 800px);
    height: min(54vw, 96vh, 450px);
  }
  #hint { position: fixed; top: 12px; left: 12px; color: #e94560; font-size: 14px; }
  #hud { position: fixed; top: 12px; right: 12px; color: #f1c40f; font-size: 14px; text-align: right; line-height: 1.4; }
  #pause-btn {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 20px; cursor: pointer; z-index: 6;
    background: rgba(15, 52, 96, 0.85); border: 1px solid #0f3460;
    width: 34px; height: 34px; border-radius: 50%;
    display: none; align-items: center; justify-content: center;
  }
  #fullscreen-btn {
    position: fixed; top: 12px; left: calc(50% + 44px); transform: translateX(-50%);
    color: #fff; font-size: 16px; cursor: pointer; z-index: 6;
    background: rgba(15, 52, 96, 0.85); border: 1px solid #0f3460;
    width: 34px; height: 34px; border-radius: 50%;
    display: none; align-items: center; justify-content: center;
  }
  #pause-menu {
    position: fixed; inset: 0; z-index: 25; background: rgba(15, 15, 30, 0.9);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; font-family: monospace; gap: 16px;
  }
  #pause-menu .pause-title { font-size: 24px; }
  #pause-menu button {
    padding: 10px 24px; font-size: 15px; font-family: monospace;
    border: none; border-radius: 8px; cursor: pointer; color: #fff;
  }
  #resume-btn { background: #2ec4b6; }
  #restart-btn { background: #f4a259; }
  #quit-btn { background: #e94560; }
  #pause-menu button, #pause-menu a {
    text-decoration: none; display: inline-block; box-sizing: border-box; text-align: center;
  }
  #arcade-link { background: #16213e; border: 1px solid #0f3460; }
  #title-screen {
    position: fixed; inset: 0; z-index: 20; background: #05050f;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; font-family: monospace; gap: 18px;
  }
  #title-screen h1 { font-size: 22px; margin: 0; }
  #title-screen button, #title-screen a {
    padding: 10px 28px; background: #e94560; border: none; border-radius: 8px;
    cursor: pointer; font-size: 16px; color: #fff; font-family: monospace;
    text-decoration: none; display: inline-block; box-sizing: border-box;
  }
  #title-arcade-link { background: #16213e; border: 1px solid #0f3460; }
  #banner {
    position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
    color: #fff; font-size: 28px; text-align: center; display: none;
    text-shadow: 0 0 8px #000; z-index: 5; cursor: pointer;
  }
  #banner span { display: block; font-size: 14px; color: #ccc; margin-top: 8px; }

  #touch-controls {
    display: none;
    justify-content: space-between; align-items: center;
    width: min(96vw, 170.6vh, 800px);
    padding: 10px 20px;
    user-select: none; -webkit-user-select: none;
    z-index: 10; flex-shrink: 0;
  }
  #touch-controls .btn {
    width: 60px; height: 60px; border-radius: 50%;
    background: rgba(15, 52, 96, 0.85); border: 2px solid #e94560;
    color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  #move-pad { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); gap: 4px; }
  #move-pad .btn { width: 44px; height: 44px; font-size: 16px; border-radius: 8px; }
  #move-pad .btn.spacer { visibility: hidden; }
  #fire-btn { width: 70px; height: 70px; font-size: 24px; }
  @media (pointer: coarse) {
    #touch-controls { display: flex; }
    #hint { display: none; }
  }
  @media (pointer: coarse) and (max-height: 500px) {
    #game-area { flex-direction: row; gap: 12px; }
    canvas { width: min(70vw, 150vh); height: min(40vw, 82vh); }
    #move-pad .btn { width: 34px; height: 34px; font-size: 13px; }
    #fire-btn { width: 50px; height: 50px; font-size: 18px; }
    #pause-btn, #fullscreen-btn { top: 6px; width: 28px; height: 28px; font-size: 14px; }
    #fullscreen-btn { left: calc(50% + 36px); }
  }
</style>
</head>
<body>
<div id="hint">Arrow keys to move, Space to fire, Esc to pause</div>
<div id="hud">Wave: 1<br>Score: 0<br>Lives: 3</div>
<div id="pause-btn">⏸</div>
<div id="fullscreen-btn">⛶</div>
<div id="banner"></div>
<div id="pause-menu">
  <div class="pause-title">Paused</div>
  <button id="resume-btn">Resume</button>
  <button id="restart-btn">Restart</button>
  <button id="quit-btn">Quit</button>
  <a id="arcade-link" href="/culture/games/" target="_top">Back to Arcade</a>
</div>
<div id="title-screen">
  <h1>Space Shooter</h1>
  <button id="title-start-btn">Start</button>
  <a id="title-arcade-link" href="/culture/games/" target="_top">Back to Arcade</a>
</div>
<div id="game-area">
  <canvas id="game" width="640" height="360"></canvas>
  <div id="touch-controls">
    <div id="move-pad">
      <div class="btn spacer"></div>
      <div class="btn" id="btn-up">▲</div>
      <div class="btn spacer"></div>
      <div class="btn" id="btn-left">◀</div>
      <div class="btn spacer"></div>
      <div class="btn" id="btn-right">▶</div>
      <div class="btn spacer"></div>
      <div class="btn" id="btn-down">▼</div>
      <div class="btn spacer"></div>
    </div>
    <div class="btn" id="fire-btn">●</div>
  </div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const banner = document.getElementById('banner');
const pauseBtn = document.getElementById('pause-btn');
const pauseMenu = document.getElementById('pause-menu');
const resumeBtn = document.getElementById('resume-btn');
const restartBtn = document.getElementById('restart-btn');
const quitBtn = document.getElementById('quit-btn');
const titleScreen = document.getElementById('title-screen');
const titleStartBtn = document.getElementById('title-start-btn');
const fullscreenBtn = document.getElementById('fullscreen-btn');

// ---- Fullscreen (vendor-prefixed, may still be blocked on some mobile/iframe combos)
function getFullscreenElement() {
  return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
}
function requestFs(el) {
  const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  return fn ? fn.call(el) : Promise.reject(new Error('unsupported'));
}
function exitFs() {
  const fn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
  return fn ? fn.call(document) : Promise.reject(new Error('unsupported'));
}
function toggleFullscreen() {
  if (!getFullscreenElement()) requestFs(document.documentElement).catch(() => {});
  else exitFs();
}
fullscreenBtn.addEventListener('click', toggleFullscreen);
const fullscreenSupported = !!(
  document.documentElement.requestFullscreen ||
  document.documentElement.webkitRequestFullscreen ||
  document.documentElement.msRequestFullscreen
);
if (!fullscreenSupported) fullscreenBtn.style.display = 'none';

const W = canvas.width, H = canvas.height;

const player = {
  x: W / 2, y: H / 2, r: 10,
  speed: 3.2,
  fireCooldown: 0,
  fireRate: 12 // frames between shots
};

let bullets = [];
let enemies = [];
let wave = 1;
let score = 0;
let lives = 3;
let gameOver = false;
let paused = false;
let waveTransitionTimer = 0;

function loadBest() {
  const stored = Number(localStorage.getItem('shooter-best'));
  return Number.isFinite(stored) ? stored : 0;
}
function saveBest(value) {
  try { localStorage.setItem('shooter-best', String(value)); } catch (e) {}
}
let best = loadBest();

function spawnWave(n) {
  enemies = [];
  const count = 4 + n * 2; // more enemies each wave
  const baseSpeed = 0.6 + n * 0.15; // faster each wave
  for (let i = 0; i < count; i++) {
    // spawn just outside the canvas edges, from a random side
    const side = Math.floor(Math.random() * 4);
    let x, y;
    if (side === 0) { x = -20; y = Math.random() * H; }
    else if (side === 1) { x = W + 20; y = Math.random() * H; }
    else if (side === 2) { x = Math.random() * W; y = -20; }
    else { x = Math.random() * W; y = H + 20; }
    enemies.push({
      x, y, r: 10 + Math.random() * 4,
      speed: baseSpeed * (0.85 + Math.random() * 0.3),
      hp: 1 + Math.floor(n / 4) // tougher enemies in later waves
    });
  }
}

function resetPlayer() {
  player.x = W / 2;
  player.y = H / 2;
}

function startNewGame() {
  wave = 1;
  score = 0;
  lives = 3;
  gameOver = false;
  paused = false;
  bullets = [];
  waveTransitionTimer = 0;
  pauseMenu.style.display = 'none';
  banner.style.display = 'none';
  resetPlayer();
  spawnWave(wave);
  updateHud();
}

function updateHud() {
  hud.innerHTML = `Wave: ${wave}<br>Score: ${score}<br>Lives: ${lives}<br>Best: ${best}`;
}

const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Escape') togglePause();
  if (e.code === 'KeyR' && gameOver) startNewGame();
});
document.addEventListener('keyup', e => keys[e.code] = false);

function bindHoldBtn(id, code) {
  const el = document.getElementById(id);
  const press = e => { e.preventDefault(); keys[code] = true; };
  const release = e => { e.preventDefault(); keys[code] = false; };
  el.addEventListener('touchstart', press, { passive: false });
  el.addEventListener('touchend', release, { passive: false });
  el.addEventListener('touchcancel', release, { passive: false });
  el.addEventListener('mousedown', press);
  el.addEventListener('mouseup', release);
  el.addEventListener('mouseleave', release);
}
bindHoldBtn('btn-up', 'ArrowUp');
bindHoldBtn('btn-down', 'ArrowDown');
bindHoldBtn('btn-left', 'ArrowLeft');
bindHoldBtn('btn-right', 'ArrowRight');
bindHoldBtn('fire-btn', 'Space');

canvas.addEventListener('touchstart', () => { if (gameOver) startNewGame(); }, { passive: true });
canvas.addEventListener('click', () => { if (gameOver) startNewGame(); });
banner.addEventListener('click', () => { if (gameOver) startNewGame(); });

function togglePause(forceState) {
  if (gameOver) return;
  paused = typeof forceState === 'boolean' ? forceState : !paused;
  pauseMenu.style.display = paused ? 'flex' : 'none';
}
pauseBtn.addEventListener('click', () => togglePause());
resumeBtn.addEventListener('click', () => togglePause(false));
restartBtn.addEventListener('click', () => { togglePause(false); startNewGame(); });
quitBtn.addEventListener('click', () => {
  togglePause(false);
  gameOver = true;
  pauseMenu.style.display = 'none';
  titleScreen.style.display = 'flex';
});
titleStartBtn.addEventListener('click', () => {
  titleScreen.style.display = 'none';
  startNewGame();
});

function endGame() {
  gameOver = true;
  if (score > best) { best = score; saveBest(best); }
  updateHud();
  banner.style.display = 'block';
  banner.innerHTML = `Game over <span>Wave ${wave} — Score ${score} — Press R or tap to retry</span>`;
}

// last known facing direction, so firing has an aim even with no separate aim control
let facing = { x: 0, y: -1 };

function update() {
  if (gameOver || paused) return;

  if (waveTransitionTimer > 0) {
    waveTransitionTimer--;
    if (waveTransitionTimer === 0) {
      wave++;
      spawnWave(wave);
      updateHud();
    }
    return;
  }

  let dx = 0, dy = 0;
  if (keys['ArrowLeft']) dx -= 1;
  if (keys['ArrowRight']) dx += 1;
  if (keys['ArrowUp']) dy -= 1;
  if (keys['ArrowDown']) dy += 1;
  if (dx !== 0 || dy !== 0) {
    const len = Math.hypot(dx, dy);
    dx /= len; dy /= len;
    facing = { x: dx, y: dy };
    player.x += dx * player.speed;
    player.y += dy * player.speed;
  }
  player.x = Math.max(player.r, Math.min(W - player.r, player.x));
  player.y = Math.max(player.r, Math.min(H - player.r, player.y));

  if (player.fireCooldown > 0) player.fireCooldown--;
  if (keys['Space'] && player.fireCooldown === 0) {
    bullets.push({
      x: player.x, y: player.y,
      vx: facing.x * 6, vy: facing.y * 6
    });
    player.fireCooldown = player.fireRate;
  }

  bullets.forEach(b => { b.x += b.vx; b.y += b.vy; });
  bullets = bullets.filter(b => b.x > -10 && b.x < W + 10 && b.y > -10 && b.y < H + 10);

  enemies.forEach(en => {
    const ex = player.x - en.x, ey = player.y - en.y;
    const dist = Math.hypot(ex, ey) || 1;
    en.x += (ex / dist) * en.speed;
    en.y += (ey / dist) * en.speed;
  });

  // bullet-enemy collisions
  for (const en of enemies) {
    for (const b of bullets) {
      if (Math.hypot(en.x - b.x, en.y - b.y) < en.r + 3) {
        en.hp--;
        b.hit = true;
      }
    }
  }
  bullets = bullets.filter(b => !b.hit);
  const beforeCount = enemies.length;
  enemies = enemies.filter(en => en.hp > 0);
  score += (beforeCount - enemies.length) * 10;
  if (beforeCount !== enemies.length) updateHud();

  // enemy-player collision
  for (const en of enemies) {
    if (Math.hypot(en.x - player.x, en.y - player.y) < en.r + player.r) {
      lives--;
      updateHud();
      enemies = enemies.filter(e2 => e2 !== en);
      resetPlayer();
      if (lives <= 0) { endGame(); return; }
      break;
    }
  }

  if (enemies.length === 0 && waveTransitionTimer === 0) {
    waveTransitionTimer = 90; // brief pause between waves
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // starfield-ish backdrop, cheap and static (no allocation per frame)
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  for (let i = 0; i < 40; i++) {
    const sx = (i * 97) % W;
    const sy = (i * 53) % H;
    ctx.fillRect(sx, sy, 1, 1);
  }

  // bullets
  ctx.fillStyle = '#f1c40f';
  bullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
    ctx.fill();
  });

  // enemies
  ctx.fillStyle = '#e94560';
  enemies.forEach(en => {
    ctx.beginPath();
    ctx.arc(en.x, en.y, en.r, 0, Math.PI * 2);
    ctx.fill();
  });

  // player ship — simple triangle pointing in facing direction
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(Math.atan2(facing.y, facing.x) + Math.PI / 2);
  ctx.fillStyle = '#2ec4b6';
  ctx.beginPath();
  ctx.moveTo(0, -player.r);
  ctx.lineTo(player.r * 0.8, player.r);
  ctx.lineTo(-player.r * 0.8, player.r);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  if (waveTransitionTimer > 0) {
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`Wave ${wave} cleared`, W / 2, H / 2);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

pauseBtn.style.display = 'flex';
if (fullscreenSupported) fullscreenBtn.style.display = 'flex';
gameOver = true;
titleScreen.style.display = 'flex';
loop();
</script>
</body>
</html>
