<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Platform Foundation — Frogger</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #05050f;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: monospace; overflow: hidden;
  }
  #game-area {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; height: 100%;
  }
  canvas {
    background: #0a0a1a; border: 2px solid #0f3460; display: block;
    touch-action: none;
    width: min(96vw, 96vh, 560px);
    height: min(96vw, 96vh, 560px);
  }
  #hint { position: fixed; top: 12px; left: 12px; color: #e94560; font-size: 14px; }
  #hud { position: fixed; top: 12px; right: 12px; color: #f1c40f; font-size: 14px; text-align: right; line-height: 1.4; }
  #pause-btn {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 20px; cursor: pointer; z-index: 6;
    background: rgba(15, 52, 96, 0.85); border: 1px solid #0f3460;
    width: 34px; height: 34px; border-radius: 50%;
    display: none; align-items: center; justify-content: center;
  }
  #fullscreen-btn {
    position: fixed; top: 12px; left: calc(50% + 44px); transform: translateX(-50%);
    color: #fff; font-size: 16px; cursor: pointer; z-index: 6;
    background: rgba(15, 52, 96, 0.85); border: 1px solid #0f3460;
    width: 34px; height: 34px; border-radius: 50%;
    display: none; align-items: center; justify-content: center;
  }
  #pause-menu {
    position: fixed; inset: 0; z-index: 25; background: rgba(15, 15, 30, 0.9);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; font-family: monospace; gap: 16px;
  }
  #pause-menu .pause-title { font-size: 24px; }
  #pause-menu button {
    padding: 10px 24px; font-size: 15px; font-family: monospace;
    border: none; border-radius: 8px; cursor: pointer; color: #fff;
  }
  #resume-btn { background: #2ec4b6; }
  #restart-btn { background: #f4a259; }
  #quit-btn { background: #e94560; }
  #pause-menu button, #pause-menu a {
    text-decoration: none; display: inline-block; box-sizing: border-box; text-align: center;
  }
  #arcade-link { background: #16213e; border: 1px solid #0f3460; }
  #title-screen {
    position: fixed; inset: 0; z-index: 20; background: #05050f;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; font-family: monospace; gap: 18px;
  }
  #title-screen h1 { font-size: 22px; margin: 0; }
  #title-screen button, #title-screen a {
    padding: 10px 28px; background: #e94560; border: none; border-radius: 8px;
    cursor: pointer; font-size: 16px; color: #fff; font-family: monospace;
    text-decoration: none; display: inline-block; box-sizing: border-box;
  }
  #title-arcade-link { background: #16213e; border: 1px solid #0f3460; }
  #banner {
    position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
    color: #fff; font-size: 26px; text-align: center; display: none;
    text-shadow: 0 0 8px #000; z-index: 5; cursor: pointer;
  }
  #banner span { display: block; font-size: 14px; color: #ccc; margin-top: 8px; }

  #touch-controls {
    display: none;
    flex-direction: column; align-items: center; gap: 6px;
    z-index: 10; flex-shrink: 0; padding: 10px 0;
    user-select: none; -webkit-user-select: none;
  }
  #touch-controls .dpad-row { display: flex; gap: 6px; }
  #touch-controls .btn {
    width: 54px; height: 54px; border-radius: 10px;
    background: rgba(15, 52, 96, 0.85); border: 2px solid #e94560;
    color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  #touch-controls .btn.spacer { visibility: hidden; }
  @media (pointer: coarse) {
    #touch-controls { display: flex; }
    #hint { display: none; }
  }
  @media (pointer: coarse) and (max-height: 500px) {
    #game-area { flex-direction: row; gap: 12px; }
    canvas { width: min(70vh, 70vw); height: min(70vh, 70vw); }
    #touch-controls .btn { width: 40px; height: 40px; font-size: 15px; }
    #pause-btn, #fullscreen-btn { top: 6px; width: 28px; height: 28px; font-size: 14px; }
    #fullscreen-btn { left: calc(50% + 36px); }
  }
</style>
</head>
<body>
<div id="hint">Arrow keys to hop, Esc to pause</div>
<div id="hud">Lives: 3<br>Time: 30<br>Score: 0</div>
<div id="pause-btn">⏸</div>
<div id="fullscreen-btn">⛶</div>
<div id="banner"></div>
<div id="pause-menu">
  <div class="pause-title">Paused</div>
  <button id="resume-btn">Resume</button>
  <button id="restart-btn">Restart</button>
  <button id="quit-btn">Quit</button>
  <a id="arcade-link" href="/culture/games/" target="_top">Back to Arcade</a>
</div>
<div id="title-screen">
  <h1>Frogger</h1>
  <button id="title-start-btn">Start</button>
  <a id="title-arcade-link" href="/culture/games/" target="_top">Back to Arcade</a>
</div>
<div id="game-area">
  <canvas id="game" width="480" height="480"></canvas>
  <div id="touch-controls">
    <div class="dpad-row">
      <div class="btn spacer"></div>
      <div class="btn" id="btn-up">▲</div>
      <div class="btn spacer"></div>
    </div>
    <div class="dpad-row">
      <div class="btn" id="btn-left">◀</div>
      <div class="btn" id="btn-down">▼</div>
      <div class="btn" id="btn-right">▶</div>
    </div>
  </div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const banner = document.getElementById('banner');
const pauseBtn = document.getElementById('pause-btn');
const pauseMenu = document.getElementById('pause-menu');
const resumeBtn = document.getElementById('resume-btn');
const restartBtn = document.getElementById('restart-btn');
const quitBtn = document.getElementById('quit-btn');
const titleScreen = document.getElementById('title-screen');
const titleStartBtn = document.getElementById('title-start-btn');
const fullscreenBtn = document.getElementById('fullscreen-btn');

function getFullscreenElement() {
  return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
}
function requestFs(el) {
  const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  return fn ? fn.call(el) : Promise.reject(new Error('unsupported'));
}
function exitFs() {
  const fn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
  return fn ? fn.call(document) : Promise.reject(new Error('unsupported'));
}
function toggleFullscreen() {
  if (!getFullscreenElement()) requestFs(document.documentElement).catch(() => {});
  else exitFs();
}
fullscreenBtn.addEventListener('click', toggleFullscreen);
const fullscreenSupported = !!(
  document.documentElement.requestFullscreen ||
  document.documentElement.webkitRequestFullscreen ||
  document.documentElement.msRequestFullscreen
);
if (!fullscreenSupported) fullscreenBtn.style.display = 'none';

// ---- Grid setup ----
// 12 rows: row 11 = start (safe), rows 6-10 = road, row 5 = median (safe),
// rows 1-4 = river, row 0 = goal lanes (5 lily-pad slots)
const COLS = 12;
const ROWS = 12;
const CELL = canvas.width / COLS;

const ROW = {
  GOAL: 0,
  RIVER_START: 1, RIVER_END: 4,
  MEDIAN: 5,
  ROAD_START: 6, ROAD_END: 10,
  START: 11
};

const GOAL_SLOTS = [1, 3, 5, 7, 9]; // columns where a lily pad exists; land elsewhere in row 0 = miss

let frog, lanes, goalsFilled, lives, timeLeft, score, gameOver, paused, timerAccum;
const TIME_LIMIT = 30; // seconds per life

function loadBest() {
  const stored = Number(localStorage.getItem('frogger-best'));
  return Number.isFinite(stored) ? stored : 0;
}
function saveBest(value) {
  try { localStorage.setItem('frogger-best', String(value)); } catch (e) {}
}
let best = loadBest();

function buildLanes() {
  lanes = [];
  // road lanes: cars, alternating direction, varying speed
  for (let r = ROW.ROAD_START; r <= ROW.ROAD_END; r++) {
    const dir = (r % 2 === 0) ? 1 : -1;
    const speed = 0.03 + (r - ROW.ROAD_START) * 0.012;
    const gap = 3.2 - (r - ROW.ROAD_START) * 0.15;
    lanes.push({
      row: r, type: 'road', dir, speed, gap,
      entities: makeEntities(dir, gap, 1.4, '#e94560')
    });
  }
  // river lanes: logs/turtles, alternating direction, act as platforms
  for (let r = ROW.RIVER_START; r <= ROW.RIVER_END; r++) {
    const dir = (r % 2 === 0) ? -1 : 1;
    const speed = 0.02 + (r - ROW.RIVER_START) * 0.008;
    const gap = 3.6 - (r - ROW.RIVER_START) * 0.1;
    const isTurtle = r % 2 === 0;
    lanes.push({
      row: r, type: 'river', dir, speed, gap,
      entities: makeEntities(dir, gap, isTurtle ? 1.0 : 2.2, isTurtle ? '#2ec4b6' : '#8b5a2b')
    });
  }
}

function makeEntities(dir, gap, width, color) {
  const list = [];
  let pos = Math.random() * gap;
  while (pos < COLS + gap) {
    list.push({ pos, width, color });
    pos += gap;
  }
  return list;
}

function resetFrog() {
  frog = { col: Math.floor(COLS / 2), row: ROW.START, ridingLane: null };
}

function startNewGame() {
  buildLanes();
  goalsFilled = new Array(GOAL_SLOTS.length).fill(false);
  lives = 3;
  score = 0;
  timeLeft = TIME_LIMIT;
  timerAccum = 0;
  gameOver = false;
  paused = false;
  pauseMenu.style.display = 'none';
  banner.style.display = 'none';
  resetFrog();
  updateHud();
}

function updateHud() {
  hud.innerHTML = `Lives: ${lives}<br>Time: ${Math.ceil(timeLeft)}<br>Score: ${score}<br>Best: ${best}`;
}

function hop(dc, dr) {
  if (gameOver) return;
  const newCol = frog.col + dc;
  const newRow = frog.row + dr;
  if (newCol < 0 || newCol >= COLS || newRow < 0 || newRow > ROW.START) return;
  frog.col = newCol;
  frog.row = newRow;
  frog.ridingLane = null;
  if (dr < 0) score += 10; // reward forward progress
  if (newRow === ROW.MEDIAN || newRow === ROW.START) timeLeft = TIME_LIMIT; // small breather resets clock
  updateHud();
}

document.addEventListener('keydown', e => {
  if (e.code === 'ArrowUp') hop(0, -1);
  else if (e.code === 'ArrowDown') hop(0, 1);
  else if (e.code === 'ArrowLeft') hop(-1, 0);
  else if (e.code === 'ArrowRight') hop(1, 0);
  else if (e.code === 'Escape') togglePause();
  else if (e.code === 'KeyR' && gameOver) startNewGame();
});

function bindDpadBtn(id, dc, dr) {
  const el = document.getElementById(id);
  const handler = e => { e.preventDefault(); hop(dc, dr); };
  el.addEventListener('touchstart', handler, { passive: false });
  el.addEventListener('mousedown', handler);
}
bindDpadBtn('btn-up', 0, -1);
bindDpadBtn('btn-down', 0, 1);
bindDpadBtn('btn-left', -1, 0);
bindDpadBtn('btn-right', 1, 0);

canvas.addEventListener('touchstart', () => { if (gameOver) startNewGame(); }, { passive: true });
canvas.addEventListener('click', () => { if (gameOver) startNewGame(); });
banner.addEventListener('click', () => { if (gameOver) startNewGame(); });

function togglePause(forceState) {
  if (gameOver) return;
  paused = typeof forceState === 'boolean' ? forceState : !paused;
  pauseMenu.style.display = paused ? 'flex' : 'none';
}
pauseBtn.addEventListener('click', () => togglePause());
resumeBtn.addEventListener('click', () => togglePause(false));
restartBtn.addEventListener('click', () => { togglePause(false); startNewGame(); });
quitBtn.addEventListener('click', () => {
  togglePause(false);
  gameOver = true;
  pauseMenu.style.display = 'none';
  titleScreen.style.display = 'flex';
});
titleStartBtn.addEventListener('click', () => {
  titleScreen.style.display = 'none';
  startNewGame();
});

function loseLife(reason) {
  lives--;
  updateHud();
  if (lives <= 0) {
    endGame();
  } else {
    resetFrog();
    timeLeft = TIME_LIMIT;
    updateHud();
  }
}

function endGame() {
  gameOver = true;
  if (score > best) { best = score; saveBest(best); }
  updateHud();
  banner.style.display = 'block';
  banner.innerHTML = `Game over <span>Score ${score} — Press R or tap to retry</span>`;
}

function laneAt(row) {
  return lanes.find(l => l.row === row);
}

function update(dt) {
  if (gameOver || paused) return;

  // countdown timer
  timeLeft -= dt;
  if (timeLeft <= 0) {
    loseLife('time');
    return;
  }
  updateHud();

  // advance all lane entities, wrapping cleanly around the track width
  const trackWidth = COLS + 4; // a little buffer past the visible columns
  lanes.forEach(lane => {
    lane.entities.forEach(en => {
      en.pos += lane.dir * lane.speed * dt * 60 / 16.6667;
      if (en.pos > trackWidth) en.pos -= (trackWidth + lane.gap);
      if (en.pos < -lane.gap - en.width) en.pos += (trackWidth + lane.gap);
    });
  });

  const currentLane = laneAt(frog.row);

  if (currentLane && currentLane.type === 'road') {
    const hit = currentLane.entities.some(en => frog.col >= en.pos - 0.1 && frog.col <= en.pos + en.width - 0.9);
    if (hit) { loseLife('car'); return; }
  }

  if (currentLane && currentLane.type === 'river') {
    const riding = currentLane.entities.find(en => frog.col >= en.pos - 0.1 && frog.col <= en.pos + en.width - 0.9);
    if (riding) {
      // carry the frog along with the log/turtle
      frog.col += currentLane.dir * currentLane.speed * dt * 60 / 16.6667;
      if (frog.col < 0 || frog.col >= COLS) { loseLife('drowned'); return; }
    } else {
      loseLife('drowned');
      return;
    }
  }

  if (frog.row === ROW.GOAL) {
    const nearestSlot = GOAL_SLOTS.reduce((best, s) =>
      Math.abs(s - frog.col) < Math.abs(best - frog.col) ? s : best, GOAL_SLOTS[0]);
    const slotIndex = GOAL_SLOTS.indexOf(nearestSlot);
    if (Math.abs(nearestSlot - frog.col) < 0.6 && !goalsFilled[slotIndex]) {
      goalsFilled[slotIndex] = true;
      score += 50;
      resetFrog();
      timeLeft = TIME_LIMIT;
      updateHud();
      if (goalsFilled.every(g => g)) {
        // all pads filled — new round, reset pads and speed things up slightly by rebuilding lanes
        goalsFilled = new Array(GOAL_SLOTS.length).fill(false);
        buildLanes();
        score += 100;
        updateHud();
      }
    } else if (!goalsFilled[slotIndex]) {
      // landed on goal row but missed a pad
      loseLife('missed pad');
      return;
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let r = 0; r < ROWS; r++) {
    let color = '#0a0a1a';
    if (r === ROW.GOAL) color = '#0d3b2e';
    else if (r >= ROW.RIVER_START && r <= ROW.RIVER_END) color = '#0e2a4a';
    else if (r === ROW.MEDIAN) color = '#16213e';
    else if (r >= ROW.ROAD_START && r <= ROW.ROAD_END) color = '#1a1a2e';
    else if (r === ROW.START) color = '#16213e';
    ctx.fillStyle = color;
    ctx.fillRect(0, r * CELL, canvas.width, CELL);
  }

  if (!frog || !lanes || !goalsFilled) return; // still on the title screen — just show the empty board

  // goal pads
  ctx.fillStyle = '#2ec4b6';
  GOAL_SLOTS.forEach((s, i) => {
    if (!goalsFilled[i]) {
      ctx.beginPath();
      ctx.arc(s * CELL + CELL / 2, ROW.GOAL * CELL + CELL / 2, CELL * 0.35, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = '#f1c40f';
      ctx.beginPath();
      ctx.arc(s * CELL + CELL / 2, ROW.GOAL * CELL + CELL / 2, CELL * 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#2ec4b6';
    }
  });

  // lane entities
  lanes.forEach(lane => {
    lane.entities.forEach(en => {
      ctx.fillStyle = en.color;
      ctx.fillRect(en.pos * CELL, lane.row * CELL + 3, en.width * CELL, CELL - 6);
    });
  });

  // frog
  ctx.fillStyle = '#f1c40f';
  ctx.beginPath();
  ctx.arc(frog.col * CELL + CELL / 2, frog.row * CELL + CELL / 2, CELL * 0.32, 0, Math.PI * 2);
  ctx.fill();
}

let lastFrameTime = performance.now();
function loop(now) {
  const dt = Math.min((now - lastFrameTime) / 1000, 0.05); // clamp to avoid big jumps on tab-switch
  lastFrameTime = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

pauseBtn.style.display = 'flex';
if (fullscreenSupported) fullscreenBtn.style.display = 'flex';
gameOver = true;
titleScreen.style.display = 'flex';
requestAnimationFrame(loop);
</script>
</body>
</html>
