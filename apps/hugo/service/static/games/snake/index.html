<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Platform Foundation — Snake</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #1a1a2e;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: monospace; overflow: hidden;
  }
  #game-area {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; height: 100%;
  }
  canvas {
    background: #16213e; border: 2px solid #0f3460; display: block;
    touch-action: none;
    width: min(96vw, 96vh, 640px);
    height: min(96vw, 96vh, 640px);
  }
  #hint { position: fixed; top: 12px; left: 12px; color: #e94560; font-size: 14px; }
  #hud { position: fixed; top: 12px; right: 12px; color: #f1c40f; font-size: 14px; text-align: right; line-height: 1.4; }
  #pause-btn {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 20px; cursor: pointer; z-index: 6;
    background: rgba(15, 52, 96, 0.85); border: 1px solid #0f3460;
    width: 34px; height: 34px; border-radius: 50%;
    display: none; align-items: center; justify-content: center;
  }
  #fullscreen-btn {
    position: fixed; top: 12px; left: calc(50% + 44px); transform: translateX(-50%);
    color: #fff; font-size: 16px; cursor: pointer; z-index: 6;
    background: rgba(15, 52, 96, 0.85); border: 1px solid #0f3460;
    width: 34px; height: 34px; border-radius: 50%;
    display: none; align-items: center; justify-content: center;
  }
  #pause-menu {
    position: fixed; inset: 0; z-index: 25; background: rgba(15, 15, 30, 0.9);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; font-family: monospace; gap: 16px;
  }
  #pause-menu .pause-title { font-size: 24px; }
  #pause-menu button {
    padding: 10px 24px; font-size: 15px; font-family: monospace;
    border: none; border-radius: 8px; cursor: pointer; color: #fff;
  }
  #resume-btn { background: #2ec4b6; }
  #restart-btn { background: #f4a259; }
  #quit-btn { background: #e94560; }
  #pause-menu button, #pause-menu a {
    text-decoration: none; display: inline-block; box-sizing: border-box; text-align: center;
  }
  #arcade-link { background: #16213e; border: 1px solid #0f3460; }
  #title-screen {
    position: fixed; inset: 0; z-index: 20; background: #05050f;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; font-family: monospace; gap: 18px;
  }
  #title-screen h1 { font-size: 22px; margin: 0; }
  #title-screen button, #title-screen a {
    padding: 10px 28px; background: #e94560; border: none; border-radius: 8px;
    cursor: pointer; font-size: 16px; color: #fff; font-family: monospace;
    text-decoration: none; display: inline-block; box-sizing: border-box;
  }
  #title-arcade-link { background: #16213e; border: 1px solid #0f3460; }
  #banner {
    position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
    color: #fff; font-size: 28px; text-align: center; display: none;
    text-shadow: 0 0 8px #000; z-index: 5; cursor: pointer;
  }
  #banner span { display: block; font-size: 14px; color: #ccc; margin-top: 8px; }

  #touch-controls {
    display: none;
    flex-direction: column; align-items: center; gap: 6px;
    z-index: 10; flex-shrink: 0; padding: 10px 0;
    user-select: none; -webkit-user-select: none;
  }
  #touch-controls .dpad-row { display: flex; gap: 6px; }
  #touch-controls .btn {
    width: 54px; height: 54px; border-radius: 10px;
    background: rgba(15, 52, 96, 0.85); border: 2px solid #e94560;
    color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  #touch-controls .btn.spacer { visibility: hidden; }
  @media (pointer: coarse) {
    #touch-controls { display: flex; }
    #hint { display: none; }
  }
  @media (pointer: coarse) and (max-height: 500px) {
    #game-area { flex-direction: row; gap: 12px; }
    canvas {
      width: min(70vh, 70vw);
      height: min(70vh, 70vw);
    }
    #touch-controls .btn { width: 40px; height: 40px; font-size: 15px; }
    #pause-btn, #fullscreen-btn { top: 6px; width: 28px; height: 28px; font-size: 14px; }
    #fullscreen-btn { left: calc(50% + 36px); }
  }
</style>
</head>
<body>
<div id="hint">Arrow keys to move, Esc to pause</div>
<div id="hud">Score: 0<br>Best: 0</div>
<div id="pause-btn">⏸</div>
<div id="fullscreen-btn">⛶</div>
<div id="banner"></div>
<div id="pause-menu">
  <div class="pause-title">Paused</div>
  <button id="resume-btn">Resume</button>
  <button id="restart-btn">Restart</button>
  <button id="quit-btn">Quit</button>
  <a id="arcade-link" href="/culture/games/" target="_top">Back to Arcade</a>
</div>
<div id="title-screen">
  <h1>Snake</h1>
  <button id="title-start-btn">Start</button>
  <a id="title-arcade-link" href="/culture/games/" target="_top">Back to Arcade</a>
</div>
<div id="game-area">
  <canvas id="game" width="480" height="480"></canvas>
  <div id="touch-controls">
    <div class="dpad-row">
      <div class="btn spacer"></div>
      <div class="btn" id="btn-up">▲</div>
      <div class="btn spacer"></div>
    </div>
    <div class="dpad-row">
      <div class="btn" id="btn-left">◀</div>
      <div class="btn" id="btn-down">▼</div>
      <div class="btn" id="btn-right">▶</div>
    </div>
  </div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const banner = document.getElementById('banner');
const pauseBtn = document.getElementById('pause-btn');
const pauseMenu = document.getElementById('pause-menu');
const resumeBtn = document.getElementById('resume-btn');
const restartBtn = document.getElementById('restart-btn');
const quitBtn = document.getElementById('quit-btn');
const titleScreen = document.getElementById('title-screen');
const titleStartBtn = document.getElementById('title-start-btn');
const fullscreenBtn = document.getElementById('fullscreen-btn');

// ---- Fullscreen (with vendor-prefix fallbacks; may still be blocked on some
// mobile browsers, especially inside an iframe — button hides if truly unsupported)
function getFullscreenElement() {
  return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
}
function requestFs(el) {
  const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  return fn ? fn.call(el) : Promise.reject(new Error('Fullscreen not supported'));
}
function exitFs() {
  const fn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
  return fn ? fn.call(document) : Promise.reject(new Error('Fullscreen not supported'));
}
function toggleFullscreen() {
  if (!getFullscreenElement()) {
    requestFs(document.documentElement).catch(() => {});
  } else {
    exitFs();
  }
}
fullscreenBtn.addEventListener('click', toggleFullscreen);
const fullscreenSupported = !!(
  document.documentElement.requestFullscreen ||
  document.documentElement.webkitRequestFullscreen ||
  document.documentElement.msRequestFullscreen
);
if (!fullscreenSupported) fullscreenBtn.style.display = 'none';

// ---- Grid setup ----
const GRID_SIZE = 24;              // 24x24 cells
const CELL = canvas.width / GRID_SIZE;
const STEP_MS = 110;               // snake speed — lower is faster

let snake, direction, nextDirection, food, score, best, gameOver, paused, lastStepTime;

function loadBest() {
  const stored = Number(localStorage.getItem('snake-best'));
  return Number.isFinite(stored) ? stored : 0;
}
function saveBest(value) {
  try { localStorage.setItem('snake-best', String(value)); } catch (e) {}
}

function randomFood() {
  let pos;
  do {
    pos = {
      x: Math.floor(Math.random() * GRID_SIZE),
      y: Math.floor(Math.random() * GRID_SIZE)
    };
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  return pos;
}

function startNewGame() {
  const mid = Math.floor(GRID_SIZE / 2);
  snake = [{ x: mid, y: mid }, { x: mid - 1, y: mid }, { x: mid - 2, y: mid }];
  direction = { x: 1, y: 0 };
  nextDirection = { x: 1, y: 0 };
  food = randomFood();
  score = 0;
  best = loadBest();
  gameOver = false;
  paused = false;
  pauseMenu.style.display = 'none';
  banner.style.display = 'none';
  lastStepTime = performance.now();
  updateHud();
}

function updateHud() {
  hud.innerHTML = `Score: ${score}<br>Best: ${best}`;
}

function setDirection(dx, dy) {
  // prevent reversing directly into yourself
  if (direction.x === -dx && direction.y === -dy) return;
  nextDirection = { x: dx, y: dy };
}

const KEY_MAP = {
  ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0]
};
document.addEventListener('keydown', e => {
  if (KEY_MAP[e.code] || KEY_MAP[e.key]) {
    const [dx, dy] = KEY_MAP[e.code] || KEY_MAP[e.key];
    setDirection(dx, dy);
  }
  if (e.code === 'Escape') togglePause();
  if (e.code === 'KeyR' && gameOver) startNewGame();
});

function bindDpadBtn(id, dx, dy) {
  const el = document.getElementById(id);
  const handler = e => { e.preventDefault(); setDirection(dx, dy); };
  el.addEventListener('touchstart', handler, { passive: false });
  el.addEventListener('mousedown', handler);
}
bindDpadBtn('btn-up', 0, -1);
bindDpadBtn('btn-down', 0, 1);
bindDpadBtn('btn-left', -1, 0);
bindDpadBtn('btn-right', 1, 0);

canvas.addEventListener('touchstart', () => { if (gameOver) startNewGame(); }, { passive: true });
canvas.addEventListener('click', () => { if (gameOver) startNewGame(); });
banner.addEventListener('click', () => { if (gameOver) startNewGame(); });

function togglePause(forceState) {
  if (gameOver) return;
  paused = typeof forceState === 'boolean' ? forceState : !paused;
  pauseMenu.style.display = paused ? 'flex' : 'none';
  if (!paused) lastStepTime = performance.now(); // avoid a big catch-up jump after resuming
}
pauseBtn.addEventListener('click', () => togglePause());
resumeBtn.addEventListener('click', () => togglePause(false));
restartBtn.addEventListener('click', () => { togglePause(false); startNewGame(); });
quitBtn.addEventListener('click', () => {
  togglePause(false);
  gameOver = true;
  pauseMenu.style.display = 'none';
  titleScreen.style.display = 'flex';
});
titleStartBtn.addEventListener('click', () => {
  titleScreen.style.display = 'none';
  startNewGame();
});

function endGame() {
  gameOver = true;
  if (score > best) {
    best = score;
    saveBest(best);
  }
  updateHud();
  banner.style.display = 'block';
  banner.innerHTML = `Game over <span>Score: ${score} — Press R or tap to retry</span>`;
}

function step() {
  direction = nextDirection;
  const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

  // wall collision
  if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
    endGame();
    return;
  }
  // self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    endGame();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    updateHud();
    food = randomFood();
    // snake grows — don't pop the tail this turn
  } else {
    snake.pop();
  }
}

function update(now) {
  if (gameOver || paused) return;
  if (now - lastStepTime >= STEP_MS) {
    step();
    lastStepTime = now;
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!snake || !food) return; // nothing to draw yet — still on the title screen

  // food
  ctx.fillStyle = '#f1c40f';
  ctx.beginPath();
  ctx.arc(
    food.x * CELL + CELL / 2,
    food.y * CELL + CELL / 2,
    CELL * 0.35, 0, Math.PI * 2
  );
  ctx.fill();

  // snake — head slightly brighter than body
  snake.forEach((seg, i) => {
    ctx.fillStyle = i === 0 ? '#2ec4b6' : '#1f8a80';
    ctx.fillRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2);
  });
}

function loop(now) {
  update(now);
  draw();
  requestAnimationFrame(loop);
}

pauseBtn.style.display = 'flex';
if (fullscreenSupported) fullscreenBtn.style.display = 'flex';
gameOver = true;
titleScreen.style.display = 'flex';
requestAnimationFrame(loop);
</script>
</body>
</html>
